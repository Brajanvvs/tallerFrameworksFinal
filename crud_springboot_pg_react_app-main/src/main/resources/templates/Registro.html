<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Taller de Uñas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); width: 400px;
        }
        .card h1 { text-align: center; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; }
        .form-group input {
            width: 100%; padding: 10px; border: 1px solid #ddd;
            border-radius: 5px; font-size: 14px;
        }
        .error { color: red; font-size: 12px; }
        .btn {
            width: 100%; padding: 12px; background: #4CAF50; color: white;
            border: none; border-radius: 5px; font-size: 16px; cursor: pointer;
        }
        .btn:hover { background: #45a049; }
        .link { text-align: center; margin-top: 15px; }
        .link a { color: #4CAF50; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Registro de Cliente</h1>
        <form th:action="@{/registro}" th:object="${cliente}" method="post">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" th:field="*{name}">
                <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}">
                <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="form-group">
                <label>Celular</label>
                <input type="text" th:field="*{cellphone}">
                <span class="error" th:if="${#fields.hasErrors('cellphone')}" th:errors="*{cellphone}"></span>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" th:field="*{password}">
            </div>
            <button type="submit" class="btn">Registrarse</button>
        </form>
        <div class="link">
            <p>¿Ya tienes cuenta? <a th:href="@{/view/login}">Inicia sesión</a></p>
        </div>
    </div>
</body>
</html>
