<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Manicuristas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 120px; }
        .error { color: red; font-size: 12px; }
        .btn { padding: 5px 10px; margin: 2px; text-decoration: none; }
        .btn-edit { background-color: #4CAF50; color: white; }
        .btn-delete { background-color: #f44336; color: white; }
    </style>
</head>
<body>
    <h1>Gestión de Manicuristas</h1>

    <form th:action="@{/view/manicuristas/guardar}" th:object="${manicurista}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" th:field="*{name}">
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-group">
            <label>Especialización:</label>
            <input type="text" th:field="*{specialization}">
        </div>

        <div class="form-group">
            <label>Servicios:</label>
            <textarea th:field="*{services}" rows="3" cols="30"></textarea>
        </div>

        <div class="form-group">
            <label>Propietaria:</label>
            <select th:field="*{propietariaId}">
                <option th:each="pro : ${propietarias}"
                        th:value="${pro.id}"
                        th:text="${pro.name}"></option>
            </select>
        </div>

        <button type="submit">Guardar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Especialización</th>
                <th>Servicios</th>
                <th>Propietaria</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="man : ${manicuristas}">
                <td th:text="${man.id}"></td>
                <td th:text="${man.name}"></td>
                <td th:text="${man.specialization}"></td>
                <td th:text="${man.services}"></td>
                <td th:text="${man.propietariaId}"></td>
                <td>
                    <a th:href="@{/view/manicuristas/editar/{id}(id=${man.id})}" class="btn btn-edit">Editar</a>
                    <a th:href="@{/view/manicuristas/eliminar/{id}(id=${man.id})}" class="btn btn-delete"
                       onclick="return confirm('¿Está seguro de eliminar este manicurista?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
