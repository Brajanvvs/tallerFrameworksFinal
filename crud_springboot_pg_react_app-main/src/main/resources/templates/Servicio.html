<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Servicios</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 120px; }
        .error { color: red; font-size: 12px; }
        .btn { padding: 5px 10px; margin: 2px; text-decoration: none; }
        .btn-edit { background-color: #4CAF50; color: white; }
        .btn-delete { background-color: #f44336; color: white; }
    </style>
</head>
<body>
    <h1>Gestión de Servicios</h1>

    <form th:action="@{/view/servicios/guardar}" th:object="${servicio}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label>Nombre del Servicio:</label>
            <input type="text" th:field="*{nameService}">
        </div>

        <div class="form-group">
            <label>Descripción:</label>
            <textarea th:field="*{description}" rows="3" cols="30"></textarea>
        </div>

        <div class="form-group">
            <label>Precio:</label>
            <input type="number" step="0.01" th:field="*{price}">
        </div>

        <div class="form-group">
            <label>Manicurista:</label>
            <select th:field="*{manicuristaId}">
                <option th:each="man : ${manicuristas}"
                        th:value="${man.id}"
                        th:text="${man.name}"></option>
            </select>
        </div>

        <button type="submit">Guardar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Manicurista</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ser : ${servicios}">
                <td th:text="${ser.id}"></td>
                <td th:text="${ser.nameService}"></td>
                <td th:text="${ser.description}"></td>
                <td th:text="${ser.price}"></td>
                <td th:text="${ser.manicuristaId}"></td>
                <td>
                    <a th:href="@{/view/servicios/editar/{id}(id=${ser.id})}" class="btn btn-edit">Editar</a>
                    <a th:href="@{/view/servicios/eliminar/{id}(id=${ser.id})}" class="btn btn-delete"
                       onclick="return confirm('¿Está seguro de eliminar este servicio?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
