<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 100px; }
        .error { color: red; font-size: 12px; }
        .btn { padding: 5px 10px; margin: 2px; text-decoration: none; }
        .btn-edit { background-color: #4CAF50; color: white; }
        .btn-delete { background-color: #f44336; color: white; }
    </style>
</head>
<body>
    <h1>Gestión de Clientes</h1>

    <form th:action="@{/view/clientes/guardar}" th:object="${cliente}" method="post">
        <input type="hidden" th:field="*{id}">
        
        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" th:field="*{name}">
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        
        <div class="form-group">
            <label>Email:</label>
            <input type="email" th:field="*{email}">
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        
        <div class="form-group">
            <label>Celular:</label>
            <input type="text" th:field="*{cellphone}">
            <span class="error" th:if="${#fields.hasErrors('cellphone')}" th:errors="*{cellphone}"></span>
        </div>
        
        <button type="submit">Guardar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Celular</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cli : ${clientes}">
                <td th:text="${cli.id}"></td>
                <td th:text="${cli.name}"></td>
                <td th:text="${cli.email}"></td>
                <td th:text="${cli.cellphone}"></td>
                <td>
                    <a th:href="@{/view/clientes/editar/{id}(id=${cli.id})}" class="btn btn-edit">Editar</a>
                    <a th:href="@{/view/clientes/eliminar/{id}(id=${cli.id})}" class="btn btn-delete" 
                       onclick="return confirm('¿Está seguro de eliminar este cliente?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
