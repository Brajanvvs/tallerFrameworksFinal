<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Taller de Uñas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); width: 350px;
        }
        .login-card h1 { text-align: center; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; }
        .form-group input {
            width: 100%; padding: 10px; border: 1px solid #ddd;
            border-radius: 5px; font-size: 14px;
        }
        .btn {
            width: 100%; padding: 12px; background: #f5576c; color: white;
            border: none; border-radius: 5px; font-size: 16px; cursor: pointer;
        }
        .btn:hover { background: #e94e62; }
        .error { color: red; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Iniciar Sesión</h1>
        <form th:action="@{/view/login}" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">Ingresar</button>
        </form>
        <p class="error" th:if="${param.error}">Email o contraseña incorrectos</p>
        <p style="text-align:center; margin-top:15px; color:green;" th:if="${param.registro}">Registro exitoso. Inicia sesión.</p>
        <div style="text-align:center; margin-top:15px;">
            <p>¿No tienes cuenta? <a th:href="@{/registro}" style="color:#f5576c;">Regístrate aquí</a></p>
        </div>
    </div>
</body>
</html>
